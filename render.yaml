services:
  - type: web
    name: room-sns
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: room-sns-db
          property: connectionString

databases:
  - name: room-sns-db
    databaseName: room_sns
    user: room_sns_user
    plan: free
